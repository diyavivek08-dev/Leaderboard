<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAHAAZ Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #181824 0%, #0b0c10 100%);
      color: #f3f4f6;
    }
    .font-teko { font-family: 'Teko', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .red-glow { box-shadow: 0 0 25px rgba(239, 68, 68, 0.25); }
    .blue-glow { box-shadow: 0 0 25px rgba(59, 130, 246, 0.25); }
    .score-anim { transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .score-bump { transform: scale(1.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">
  <!-- Header -->
  <header class="text-center mb-8">
    <div class="inline-flex items-center gap-3 bg-white/5 border border-white/10 px-6 py-2 rounded-full mb-3">
      <i class="fa-solid fa-flag-checkered text-yellow-400 text-xl"></i>
      <span class="text-xs uppercase tracking-widest text-gray-400 font-semibold">Live Event Controller</span>
    </div>
    <h1 class="text-5xl md:text-7xl font-bold font-teko uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-purple-400 to-blue-500">
      JAHAAZ Leaderboard
    </h1>
  </header>

  <main class="max-w-6xl mx-auto w-full space-y-8">
    <!-- Side-by-Side Team Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
      <!-- Team Red Card -->
      <div class="glass-card red-glow rounded-3xl p-6 md:p-8 flex flex-col justify-between border-t-4 border-t-red-500 relative overflow-hidden">
        <div class="flex items-center justify-between mb-4">
          <input type="text" value="TEAM RED" id="redName" onchange="saveNames()" class="bg-transparent text-2xl font-bold font-teko tracking-wide text-red-400 uppercase outline-none focus:border-b border-red-500 w-3/4">
          <i class="fa-solid fa-fire text-red-500 text-2xl"></i>
        </div>

        <div class="text-center py-6">
          <div id="redScore" class="score-anim text-7xl md:text-9xl font-extrabold font-teko text-white tracking-tight">0</div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Total Points</span>
        </div>

        <!-- Quick Score Buttons -->
        <div class="space-y-3">
          <div class="grid grid-cols-5 gap-2">
            <button onclick="updateScore('red', -10)" class="bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">-10</button>
            <button onclick="updateScore('red', 10)" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+10</button>
            <button onclick="updateScore('red', 15)" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+15</button>
            <button onclick="updateScore('red', 20)" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+20</button>
            <button onclick="updateScore('red', 30)" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 text-red-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+30</button>
          </div>
          <button onclick="resetScore('red')" class="w-full text-xs text-gray-500 hover:text-red-400 py-1 transition">Reset Red Score</button>
        </div>
      </div>

      <!-- Team Blue Card -->
      <div class="glass-card blue-glow rounded-3xl p-6 md:p-8 flex flex-col justify-between border-t-4 border-t-blue-500 relative overflow-hidden">
        <div class="flex items-center justify-between mb-4">
          <input type="text" value="TEAM BLUE" id="blueName" onchange="saveNames()" class="bg-transparent text-2xl font-bold font-teko tracking-wide text-blue-400 uppercase outline-none focus:border-b border-blue-500 w-3/4">
          <i class="fa-solid fa-bolt text-blue-500 text-2xl"></i>
        </div>

        <div class="text-center py-6">
          <div id="blueScore" class="score-anim text-7xl md:text-9xl font-extrabold font-teko text-white tracking-tight">0</div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Total Points</span>
        </div>

        <!-- Quick Score Buttons -->
        <div class="space-y-3">
          <div class="grid grid-cols-5 gap-2">
            <button onclick="updateScore('blue', -10)" class="bg-blue-950/60 hover:bg-blue-900 border border-blue-800 text-blue-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">-10</button>
            <button onclick="updateScore('blue', 10)" class="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/50 text-blue-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+10</button>
            <button onclick="updateScore('blue', 15)" class="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/50 text-blue-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+15</button>
            <button onclick="updateScore('blue', 20)" class="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/50 text-blue-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+20</button>
            <button onclick="updateScore('blue', 30)" class="bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/50 text-blue-300 py-3 rounded-xl font-bold text-sm transition active:scale-95">+30</button>
          </div>
          <button onclick="resetScore('blue')" class="w-full text-xs text-gray-500 hover:text-blue-400 py-1 transition">Reset Blue Score</button>
        </div>
      </div>
    </div>

    <!-- Live Bar Graph Section -->
    <div class="glass-card rounded-3xl p-6 md:p-8 space-y-4">
      <div class="flex justify-between items-center text-sm font-semibold text-gray-400 uppercase tracking-wider">
        <span id="redPercentLabel" class="text-red-400">Team Red: 50%</span>
        <span id="leadStatus" class="text-yellow-400 font-bold">TIED</span>
        <span id="bluePercentLabel" class="text-blue-400">Team Blue: 50%</span>
      </div>

      <!-- Combined Bar Graph -->
      <div class="h-8 w-full bg-gray-800 rounded-full overflow-hidden flex p-1 border border-white/10">
        <div id="redBar" class="h-full bg-gradient-to-r from-red-600 to-red-400 rounded-l-full transition-all duration-500" style="width: 50%;"></div>
        <div id="blueBar" class="h-full bg-gradient-to-r from-blue-400 to-blue-600 rounded-r-full transition-all duration-500" style="width: 50%;"></div>
      </div>
    </div>
  </main>

  <!-- Footer Controls -->
  <footer class="mt-8 text-center space-x-4">
    <button onclick="resetAll()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 px-6 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition">
      <i class="fa-solid fa-rotate-left mr-2"></i>Reset All
    </button>
  </footer>

  <script>
    let scores = { red: 0, blue: 0 };
    let leader = null;

    // Web Audio Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function updateScore(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      playBeep(delta > 0 ? (team === 'red' ? 520 : 650) : 220, 'square');
      
      const el = document.getElementById(team + 'Score');
      el.innerText = scores[team];
      el.classList.add('score-bump');
      setTimeout(() => el.classList.remove('score-bump'), 150);

      checkLeadChange();
      renderGraph();
    }

    function checkLeadChange() {
      let currentLeader = null;
      if (scores.red > scores.blue) currentLeader = 'red';
      else if (scores.blue > scores.red) currentLeader = 'blue';

      if (currentLeader && currentLeader !== leader) {
        leader = currentLeader;
        confetti({
          particleCount: 80,
          spread: 60,
          origin: { y: 0.6 },
          colors: currentLeader === 'red' ? ['#ef4444', '#f87171'] : ['#3b82f6', '#60a5fa']
        });
      } else if (!currentLeader) {
        leader = null;
      }
    }

    function renderGraph() {
      const total = scores.red + scores.blue;
      let redPct = 50;
      let bluePct = 50;

      if (total > 0) {
        redPct = Math.round((scores.red / total) * 100);
        bluePct = 100 - redPct;
      }

      document.getElementById('redBar').style.width = redPct + '%';
      document.getElementById('blueBar').style.width = bluePct + '%';

      const redName = document.getElementById('redName').value;
      const blueName = document.getElementById('blueName').value;

      document.getElementById('redPercentLabel').innerText = `${redName}: ${redPct}%`;
      document.getElementById('bluePercentLabel').innerText = `${blueName}: ${bluePct}%`;

      const statusEl = document.getElementById('leadStatus');
      if (scores.red > scores.blue) {
        statusEl.innerText = `${redName} LEADS (+${scores.red - scores.blue})`;
        statusEl.className = 'text-red-400 font-bold';
      } else if (scores.blue > scores.red) {
        statusEl.innerText = `${blueName} LEADS (+${scores.blue - scores.red})`;
        statusEl.className = 'text-blue-400 font-bold';
      } else {
        statusEl.innerText = 'TIED';
        statusEl.className = 'text-yellow-400 font-bold';
      }
    }

    function resetScore(team) {
      scores[team] = 0;
      document.getElementById(team + 'Score').innerText = 0;
      checkLeadChange();
      renderGraph();
    }

    function resetAll() {
      scores.red = 0;
      scores.blue = 0;
      document.getElementById('redScore').innerText = 0;
      document.getElementById('blueScore').innerText = 0;
      leader = null;
      renderGraph();
    }

    function saveNames() {
      renderGraph();
    }
  </script>
</body>
</html>
